name: Transcode videos

# Chuyển mã video đang chờ (scripts/transcode-worker.ts).
# - repository_dispatch: app gọi ngay sau khi có video mới (cần GITHUB_DISPATCH_TOKEN trên Vercel)
# - schedule: lưới an toàn, nhặt video bị sót hoặc khi chưa cấu hình token
# - workflow_dispatch: chạy tay từ tab Actions
on:
  repository_dispatch:
    types: [transcode]
  schedule:
    # Mỗi 3 giờ (phút 17 để tránh giờ chẵn, lúc GitHub hay trễ lịch)
    - cron: "17 */3 * * *"
  workflow_dispatch:

# Một lượt chạy tại một thời điểm; lượt mới chờ lượt cũ xong.
# Trong một lượt có nhiều worker song song (xem job "plan"); worker nào cũng chạy tới khi hàng đợi trống,
# nên video upload thêm trong lúc đang chạy cũng được nhặt luôn.
concurrency:
  group: transcode
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Số máy chuyển mã chạy song song tối đa (repo public: GitHub cho tới 20 job cùng lúc, miễn phí)
  MAX_WORKERS: 4

jobs:
  # Đếm video đang chờ → quyết định bật bao nhiêu worker (0 nếu không có việc / chưa cấu hình)
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      workers: ${{ steps.queue.outputs.workers }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
    steps:
      - name: Check configuration and queue
        id: queue
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$R2_BUCKET" ] || [ -z "$R2_ACCESS_KEY_ID" ]; then
            echo "Transcoding is not configured (missing repository secrets) — skipping."
            echo "workers=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # psql có sẵn trên runner: hỏi nhanh, không phải cài gì khi hàng đợi trống
          read -r queued processing < <(psql "$DATABASE_URL" -tA -F ' ' -c \
            "select count(*) filter (where status = 'queued'), count(*) filter (where status = 'processing') from photos where kind = 'video'")
          echo "Queued: $queued, processing: $processing"
          if [ "$queued" -gt 0 ]; then
            n=$(( queued < MAX_WORKERS ? queued : MAX_WORKERS ))
          elif [ "$processing" -gt 0 ]; then
            n=1 # có thể là việc bị bỏ dở từ lượt trước — một worker để nhận lại
          else
            n=0
          fi
          workers=$(seq -s, 1 "$n")
          echo "Starting $n worker(s)"
          echo "workers=[${workers}]" >> "$GITHUB_OUTPUT"

  transcode:
    needs: plan
    if: needs.plan.outputs.workers != '[]'
    name: Worker ${{ matrix.worker }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.plan.outputs.workers) }}
    env:
      WORKER_ID: ${{ matrix.worker }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && ffmpeg -version | head -1
      - run: npm ci
      - name: Transcode queued videos
        run: npx tsx scripts/transcode-worker.ts
