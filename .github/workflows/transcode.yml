name: Transcode videos

# Chuyển mã video đang chờ (scripts/transcode-worker.ts).
# - repository_dispatch: app gọi ngay sau khi có video mới (cần GITHUB_DISPATCH_TOKEN trên Vercel)
# - schedule: lưới an toàn, nhặt video bị sót hoặc khi chưa cấu hình token
# - workflow_dispatch: chạy tay từ tab Actions
on:
  repository_dispatch:
    types: [transcode]
  schedule:
    # Mỗi 3 giờ (phút 17 để tránh giờ chẵn, lúc GitHub hay trễ lịch)
    - cron: "17 */3 * * *"
  workflow_dispatch:

# Một worker tại một thời điểm; lượt mới chờ lượt cũ xong (worker chạy tới khi hết việc)
concurrency:
  group: transcode
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  transcode:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Check configuration and queue
        id: secrets
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$R2_BUCKET" ] || [ -z "$R2_ACCESS_KEY_ID" ]; then
            echo "Transcoding is not configured (missing repository secrets) — skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Hỏi nhanh bằng psql (có sẵn trên runner) để lượt chạy định kỳ không phải cài gì khi hàng đợi trống
          pending=$(psql "$DATABASE_URL" -tAc "select count(*) from photos where kind = 'video' and status in ('queued', 'processing')")
          echo "Videos waiting: $pending"
          if [ "$pending" = "0" ]; then echo "ready=false" >> "$GITHUB_OUTPUT"; else echo "ready=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install ffmpeg
        if: steps.secrets.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && ffmpeg -version | head -1
      - run: npm ci
        if: steps.secrets.outputs.ready == 'true'
      - name: Transcode queued videos
        if: steps.secrets.outputs.ready == 'true'
        run: npx tsx scripts/transcode-worker.ts
